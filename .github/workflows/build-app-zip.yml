name: Build app zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd NotchBuddy && xcodegen generate

      - name: Build Release (unsigned)
        run: |
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR="$GITHUB_WORKSPACE/build"

      - name: Zip app
        run: |
          cd build
          ditto -c -k --keepParent Coucou.app Coucou.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coucou.zip
          path: build/Coucou.zip
